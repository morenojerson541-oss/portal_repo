<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal de Repaso - 3DS B (v0.4)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600;700&family=Orbitron:wght@600;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-color: #070a15;
      --panel-bg: #0f1630;
      --border-color: #222c55;
      --primary-cyan: #22d3ee;
      --accent-magenta: #f046d2;
      --text-main: #e8edfb;
      --text-muted: #9ba7ce;
      --font-title: 'Orbitron', sans-serif;
      --font-body: 'Exo 2', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: var(--font-body);
      line-height: 1.6;
    }

    .navbar {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(7, 10, 21, 0.9);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border-color);
      padding: 14px 24px;
    }

    .nav-container {
      max-width: 1080px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-family: var(--font-title);
      font-weight: 800;
      font-size: 16px;
      color: var(--primary-cyan);
    }

    .tag-version {
      background: rgba(34, 211, 238, 0.1);
      border: 1px solid var(--primary-cyan);
      color: var(--primary-cyan);
      font-size: 12px;
      padding: 2px 10px;
      border-radius: 999px;
    }

    .hero {
      padding: 50px 20px 30px;
      text-align: center;
      border-bottom: 1px solid var(--border-color);
      background: radial-gradient(circle at top, rgba(240, 70, 210, 0.12), transparent 70%);
    }

    .hero h1 {
      font-family: var(--font-title);
      font-size: clamp(26px, 4vw, 38px);
      color: #fff;
      margin-bottom: 8px;
    }

    .hero-subtitle { color: var(--text-muted); font-size: 16px; }

    .main-container {
      max-width: 1080px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .section-title {
      font-family: var(--font-title);
      font-size: 20px;
      margin-bottom: 20px;
      border-left: 4px solid var(--primary-cyan);
      padding-left: 12px;
    }

    .modulos-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
    }

    .proy {
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s, border-color 0.2s;
    }

    .proy:hover {
      transform: translateY(-3px);
      border-color: var(--primary-cyan);
    }

    .proy h3 {
      font-family: var(--font-title);
      font-size: 16px;
      color: #fff;
      margin-bottom: 8px;
    }

    .proy .lema {
      color: var(--primary-cyan);
      font-size: 13px;
      margin-bottom: 10px;
    }

    .proy p { color: var(--text-muted); font-size: 14.5px; margin-bottom: 16px; }

    .btn-sec {
      background: linear-gradient(135deg, #0891b2, var(--primary-cyan));
      color: #04121a;
      font-weight: 700;
      border: none;
      border-radius: 8px;
      padding: 9px 16px;
      cursor: pointer;
      width: 100%;
      text-align: center;
    }
    .btn-sec:hover { filter: brightness(1.1); }

    .modal {
      margin: auto;
      border: 1px solid var(--border-color);
      border-radius: 14px;
      background: var(--panel-bg);
      color: var(--text-main);
      padding: 30px;
      max-width: 650px;
      width: 90%;
    }
    .modal::backdrop { background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(4px); }
    .modal-content { position: relative; }
    
    .btn-close {
      position: absolute;
      top: -10px;
      right: 0;
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 28px;
      cursor: pointer;
    }
    .btn-close:hover { color: var(--accent-magenta); }
  </style>
</head>
<body>

  <nav class="navbar">
    <div class="nav-container">
      <span class="logo">PORTAL DE REPASO · 3DS B</span>
      <span class="tag-version">Versión v0.4</span>
    </div>
  </nav>

  <header class="hero">
    <div class="hero-content">
      <h1>Portal del Año (Prof. Arcides Canales)</h1>
      <p class="hero-subtitle">Módulos técnicos y proyectos desarrollados durante el año lectivo.</p>
    </div>
  </header>

  <main class="main-container">
    <h2 class="section-title">Módulos Asignados</h2>
    <div id="contenedor-modulos" class="modulos-grid"></div>
  </main>

  <dialog id="modal-ficha" class="modal">
    <div class="modal-content">
      <button class="btn-close" onclick="cerrarFicha()">&times;</button>
      <div id="modal-body"></div>
    </div>
  </dialog>

  <script>
    const modulosData = [
      {
        id: "mod-arcides-1",
        titulo: "BTVDS 3.1 Desarrollo de aplicaciones de software para la solución de problemas",
        docente: "Arcides Canales",
        resumen: "Enfoque en Programación Orientada a Objetos (POO) avanzada, herencia, polimorfismo, creación de bases de datos, conexión y prácticas con ASP.NET Razor.",
        instrumentos: ["Guías de práctica de POO", "Rúbricas de evaluación de bases de datos", "Pruebas cortas de acceso a datos"],
        programas: ["Visual Studio", "SQL Server Management Studio", "SQL Server"],
        herramientas: ["C#", ".NET Framework / .NET Core", "ASP.NET Razor", "SQL"],
        recursos: [
          { nombre: "Documentación oficial de C# (Microsoft Learn)", url: "https://learn.microsoft.com/es-es/dotnet/csharp/" },
          { nombre: "Guías de SQL Server", url: "https://learn.microsoft.com/es-es/sql/sql-server/" }
        ],
        evidencias: [
          { titulo: "Práctica 02 POO Herencia y Polimorfismo", url: "https://github.com/" },
          { titulo: "Práctica 05 Code First ASP Razor", url: "https://github.com/" }
        ]
      },
      {
        id: "mod-arcides-2",
        titulo: "Modulo 2 Desarrollo de componentes para dispositivos móviles",
        docente: "Arcides Canales",
        resumen: "Desarrollo de aplicaciones multiplataforma utilizando el framework .NET MAUI, estructurando componentes visuales y lógicas adaptadas a entornos móviles.",
        instrumentos: ["Rúbrica de prácticas de .NET MAUI", "Lista de cotejo para interfaces móviles", "Autoevaluación de prácticas"],
        programas: ["Visual Studio", "Emulador de Android / Dispositivo físico"],
        herramientas: ["C#", ".NET MAUI", "XAML"],
        recursos: [
          { nombre: "Documentación oficial de .NET MAUI", url: "https://learn.microsoft.com/es-es/dotnet/maui/" }
        ],
        evidencias: [
          { titulo: "Práctica 9 Net Maui", url: "https://github.com/" }
        ]
      },
      {
        id: "mod-arcides-3",
        titulo: "Modulo 3 Conversación de ingles sobre mantenimiento de sistemas informáticos",
        docente: "Arcides Canales",
        resumen: "Integración de metodologías ágiles de desarrollo de software como Scrum y prácticas avanzadas de bases de datos conectadas con IA.",
        instrumentos: ["Guía de prácticas Scrum", "Rúbrica de base de datos CRUD-IA"],
        programas: ["Visual Studio Code", "Visual Studio", "Gestor de bases de datos"],
        herramientas: ["Scrum Framework", "Bases de datos relacionales", "Asistentes de IA para código"],
        recursos: [
          { nombre: "Scrum Guide oficial", url: "https://scrumguides.org/" }
        ],
        evidencias: [
          { titulo: "Practica 10 Scrum", url: "https://github.com/" },
          { titulo: "Practica 11 Base de datos CRUD-IA", url: "https://github.com/" }
        ]
      },
      {
        id: "mod-arcides-4",
        titulo: "Modulo 4 Puesta en marcha de la empresa en asociatividad cooperativa",
        docente: "Arcides Canales",
        resumen: "Gestión y desarrollo de proyectos empresariales avanzados, integración de hardware con Arduino, pasarela e-commerce con PrestaShop y aplicaciones en WinForms, ASPX y .NET MAUI.",
        instrumentos: ["Rúbrica de proyecto final de PrestaShop", "Evaluación de prototipo Arduino", "Rúbrica de proyectos .NET MAUI y Winform"],
        programas: ["XAMPP / Servidor local", "Visual Studio", "Arduino IDE"],
        herramientas: ["PrestaShop", "Arduino", "C# / WinForms / ASPX", ".NET MAUI"],
        recursos: [
          { nombre: "Documentación oficial de PrestaShop", url: "https://devdocs.prestashop-project.org/" },
          { nombre: "Arduino Reference", url: "https://www.arduino.cc/reference/es/" }
        ],
        evidencias: [
          { titulo: "Proyecto PrestaShop Individual", url: "https://github.com/" },
          { titulo: "Proyecto Final .NET MAUI", url: "https://github.com/" }
        ]
      }
    ];

    function cargarModulos() {
      const contenedor = document.getElementById("contenedor-modulos");
      if (!contenedor) return;
      contenedor.innerHTML = "";

      modulosData.forEach(modulo => {
        const card = document.createElement("article");
        card.className = "proy";
        card.innerHTML = `
          <div>
            <h3>${modulo.titulo}</h3>
            <p class="lema"><b>Docente:</b> ${modulo.docente}</p>
            <p>${modulo.resumen}</p>
          </div>
          <button onclick="verFicha('${modulo.id}')" class="btn-sec">Ver Ficha Completa</button>
        `;
        contenedor.appendChild(card);
      });
    }

    function verFicha(id) {
      const modulo = modulosData.find(m => m.id === id);
      if (!modulo) return;

      const modalBody = document.getElementById("modal-body");
      modalBody.innerHTML = `
        <h2 style="font-family: var(--font-title); color: var(--primary-cyan); font-size:18px; margin-bottom: 6px;">${modulo.titulo}</h2>
        <p style="font-size:14px; margin-bottom: 12px;"><b>Docente:</b> ${modulo.docente}</p>
        <hr style="border: 0; border-top: 1px solid var(--border-color); margin: 12px 0;">
        <p style="margin-bottom: 12px; font-size:14.5px;">${modulo.resumen}</p>

        <h4 style="color: var(--accent-magenta); font-size:14px; margin-top: 10px;">Instrumentos</h4>
        <p style="font-size:14px; color:var(--text-muted);">${modulo.instrumentos.join(", ")}</p>

        <h4 style="color: var(--accent-magenta); font-size:14px; margin-top: 10px;">Programas</h4>
        <p style="font-size:14px; color:var(--text-muted);">${modulo.programas.join(", ")}</p>

        <h4 style="color: var(--accent-magenta); font-size:14px; margin-top: 10px;">Herramientas</h4>
        <p style="font-size:14px; color:var(--text-muted);">${modulo.herramientas.join(", ")}</p>

        <h4 style="color: var(--accent-magenta); font-size:14px; margin-top: 10px;">Recursos</h4>
        <ul style="padding-left: 20px; font-size:14px; color:var(--text-muted);">
          ${modulo.recursos.map(recurso => `<li><a href="${recurso.url}" target="_blank" rel="noopener noreferrer">${recurso.nombre}</a></li>`).join("")}
        </ul>

        <h4 style="color: var(--accent-magenta); font-size:14px; margin-top: 10px;">Evidencias</h4>
        <ul style="padding-left: 20px; font-size:14px; color:var(--text-muted);">
          ${modulo.evidencias.map(evidencia => `<li><a href="${evidencia.url}" target="_blank" rel="noopener noreferrer">${evidencia.titulo}</a></li>`).join("")}
        </ul>
      `;

      document.getElementById("modal-ficha").showModal();
    }

    function cerrarFicha() {
      document.getElementById("modal-ficha").close();
    }

    cargarModulos();
  </script>
</body>
</html>
