<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal de Repaso - 3DS B (v0.4 Pro)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600;700&family=Orbitron:wght@600;800&display=swap" rel="stylesheet">
  
  <style>
    :root[data-theme="dark"] {
      --bg-color: #070a15;
      --panel-bg: #0f1630;
      --border-color: #222c55;
      --primary-cyan: #22d3ee;
      --accent-magenta: #f046d2;
      --accent-purple: #a855f7;
      --text-main: #e8edfb;
      --text-muted: #9ba7ce;
      --input-bg: #131c3f;
    }

    :root[data-theme="light"] {
      --bg-color: #f4f6fb;
      --panel-bg: #ffffff;
      --border-color: #cbd5e1;
      --primary-cyan: #0284c7;
      --accent-magenta: #db2777;
      --accent-purple: #7c3aed;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --input-bg: #f1f5f9;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Exo 2', sans-serif;
      line-height: 1.6;
    }

    .navbar {
      position: sticky;
      top: 0;
      z-index: 10;
      background: var(--panel-bg);
      border-bottom: 1px solid var(--border-color);
      padding: 14px 24px;
    }

    .nav-container {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-family: 'Orbitron', sans-serif;
      font-weight: 800;
      font-size: 16px;
      color: var(--primary-cyan);
    }

    .nav-controls {
      display: flex;
      gap: 15px;
      align-items: center;
    }

    .tag-version {
      background: rgba(34, 211, 238, 0.1);
      border: 1px solid var(--primary-cyan);
      color: var(--primary-cyan);
      font-size: 12px;
      padding: 3px 12px;
      border-radius: 999px;
      font-family: 'Orbitron', sans-serif;
    }

    .btn-theme {
      background: var(--input-bg);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-family: 'Orbitron', sans-serif;
      font-size: 11px;
    }
    .btn-theme:hover { border-color: var(--primary-cyan); }

    .hero {
      padding: 40px 20px 20px;
      text-align: center;
      border-bottom: 1px solid var(--border-color);
      background: radial-gradient(circle at top, rgba(168, 85, 247, 0.12), transparent 70%);
    }

    .hero h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(26px, 4vw, 38px);
      color: var(--text-main);
      margin-bottom: 10px;
    }

    .hero-subtitle { color: var(--text-muted); font-size: 15px; margin-bottom: 20px; }

    .filter-container {
      max-width: 600px;
      margin: 0 auto;
      padding: 0 20px;
    }

    .search-input {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
    }
    .search-input:focus { border-color: var(--primary-cyan); }

    .main-container {
      max-width: 1200px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .profesor-section {
      margin-bottom: 40px;
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 25px;
    }

    .profesor-header {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 20px;
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 12px;
    }

    .profesor-badge {
      background: linear-gradient(135deg, var(--accent-purple), var(--accent-magenta));
      color: #fff;
      font-family: 'Orbitron', sans-serif;
      font-size: 12px;
      padding: 5px 12px;
      border-radius: 6px;
      text-transform: uppercase;
    }

    .profesor-header h2 {
      font-family: 'Orbitron', sans-serif;
      font-size: 20px;
      color: var(--text-main);
    }

    .modulos-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
    }

    .proy {
      background: var(--bg-color);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s, border-color 0.2s;
    }

    .proy:hover {
      transform: translateY(-3px);
      border-color: var(--primary-cyan);
    }

    .proy h3 {
      font-family: 'Orbitron', sans-serif;
      font-size: 14.5px;
      color: var(--text-main);
      margin-bottom: 8px;
    }

    .proy .lema {
      color: var(--primary-cyan);
      font-size: 12.5px;
      margin-bottom: 8px;
      font-weight: 600;
    }

    .proy p { color: var(--text-muted); font-size: 13.5px; margin-bottom: 15px; }

    .card-footer {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .checkbox-progreso {
      width: 20px;
      height: 20px;
      accent-color: var(--primary-cyan);
      cursor: pointer;
    }

    .btn-sec {
      background: linear-gradient(135deg, #0891b2, var(--primary-cyan));
      color: #04121a;
      font-family: 'Orbitron', sans-serif;
      font-size: 11.5px;
      font-weight: 700;
      border: none;
      border-radius: 8px;
      padding: 9px 14px;
      cursor: pointer;
      flex: 1;
      text-align: center;
    }
    .btn-sec:hover { filter: brightness(1.15); }

    .modal {
      margin: auto;
      border: 1px solid var(--border-color);
      border-radius: 16px;
      background: var(--panel-bg);
      color: var(--text-main);
      padding: 30px;
      max-width: 600px;
      width: 90%;
    }
    .modal::backdrop { background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(4px); }
    .modal-content { position: relative; }
    
    .btn-close {
      position: absolute;
      top: -10px;
      right: 0;
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 26px;
      cursor: pointer;
    }
    .btn-close:hover { color: var(--accent-magenta); }
  </style>
</head>
<body>

  <nav class="navbar">
    <div class="nav-container">
      <span class="logo">PORTAL DE REPASO · PRO</span>
      <div class="nav-controls">
        <button class="btn-theme" onclick="alternarTema()">🌓 Modo</button>
        <span class="tag-version">Nivel 2 Pro</span>
      </div>
    </div>
  </nav>

  <header class="hero">
    <div class="hero-content">
      <h1>Portal Académico Interactivo</h1>
      <p class="hero-subtitle">Gestión de módulos con buscador, progreso guardado y modo claro/oscuro.</p>
    </div>
    <div class="filter-container">
      <input type="text" id="buscador" class="search-input" placeholder="🔍 Buscar módulo o herramienta..." onkeyup="filtrarModulos()">
    </div>
  </header>

  <main class="main-container">
    <section class="profesor-section">
      <div class="profesor-header">
        <span class="profesor-badge">Docente</span>
        <h2>Prof. Javier</h2>
      </div>
      <div id="grid-javier" class="modulos-grid"></div>
    </section>

    <section class="profesor-section">
      <div class="profesor-header">
        <span class="profesor-badge" style="background: linear-gradient(135deg, #0891b2, #22d3ee); color:#04121a;">Docente</span>
        <h2>Prof. Arcides Canales</h2>
      </div>
      <div id="grid-arcides" class="modulos-grid"></div>
    </section>
  </main>

  <dialog id="modal-ficha" class="modal">
    <div class="modal-content">
      <button class="btn-close" onclick="cerrarFicha()">&times;</button>
      <div id="modal-body"></div>
    </div>
  </dialog>

  <script>
    const modulosData = [
      {
        id: "mod-javier-0",
        docente: "Prof. Javier",
        titulo: "Módulo 3.0 Orientación de estudiantes",
        resumen: "Inducción al tercer año, creación de equipos de trabajo y portafolio estudiantil.",
        instrumentos: ["Guía de inducción"],
        programas: ["Plataforma Educativa"],
        herramientas: ["Portafolio digital"],
        recursos: [{ nombre: "Generalidades", url: "https://classroom.google.com/" }],
        evidencias: [{ titulo: "Creación de equipo", url: "https://github.com/" }]
      },
      {
        id: "mod-javier-2",
        docente: "Prof. Javier",
        titulo: "Módulo 3.2 Mantenimiento de sistemas informáticos",
        resumen: "Monitoreo, registro de mantenimiento, creación de dashboards operativos y planes de contingencia.",
        instrumentos: ["Guías de monitoreo"],
        programas: ["Visual Studio"],
        herramientas: ["Dashboards", "Bitácoras"],
        recursos: [{ nombre: "Docs Microsoft", url: "https://learn.microsoft.com/" }],
        evidencias: [{ titulo: "Monitoreo y Registro", url: "https://github.com/" }]
      },
      {
        id: "mod-javier-3",
        docente: "Prof. Javier",
        titulo: "Módulo 3.3 Administración de Bases de Datos",
        resumen: "Gestión avanzada de bases de datos, optimización de consultas y Power BI.",
        instrumentos: ["Rúbrica SQL"],
        programas: ["SQL Server", "Power BI"],
        herramientas: ["SQL"],
        recursos: [{ nombre: "Power BI Docs", url: "https://learn.microsoft.com/" }],
        evidencias: [{ titulo: "Actividad Power BI", url: "https://github.com/" }]
      },
      {
        id: "mod-javier-4",
        docente: "Prof. Javier",
        titulo: "Módulo 3.4 Elaboración de documentación",
        resumen: "Fases de desarrollo, arquitectura de software y guías de Python individuales.",
        instrumentos: ["Rúbrica técnica"],
        programas: ["VS Code"],
        herramientas: ["Python"],
        recursos: [{ nombre: "Python Docs", url: "https://www.python.org/" }],
        evidencias: [{ titulo: "Guía Python Individual", url: "https://github.com/" }]
      },
      {
        id: "mod-javier-8",
        docente: "Prof. Javier",
        titulo: "Módulo 3.8 Proyecto innovador de Desarrollo",
        resumen: "Desarrollo y entrega de proyectos innovadores, avances de software y exposiciones.",
        instrumentos: ["Rúbrica de proyecto"],
        programas: ["Visual Studio", "GitHub"],
        herramientas: ["Git", "C#"],
        recursos: [{ nombre: "Guía de proyectos", url: "https://github.com/" }],
        evidencias: [{ titulo: "Avance 1 Proyecto", url: "https://github.com/" }]
      },
      {
        id: "mod-arcides-1",
        docente: "Prof. Arcides Canales",
        titulo: "BTVDS 3.1 Desarrollo de aplicaciones de software",
        resumen: "Programación Orientada a Objetos (POO) avanzada, herencia, polimorfismo y ASP.NET Razor.",
        instrumentos: ["Guías POO"],
        programas: ["Visual Studio", "SQL Server"],
        herramientas: ["C#", "ASP.NET"],
        recursos: [{ nombre: "C# Learn", url: "https://learn.microsoft.com/" }],
        evidencias: [{ titulo: "Práctica 02 POO", url: "https://github.com/" }]
      },
      {
        id: "mod-arcides-2",
        docente: "Prof. Arcides Canales",
        titulo: "Modulo 2 Desarrollo dispositivos móviles",
        resumen: "Aplicaciones multiplataforma utilizando el framework .NET MAUI y componentes móviles.",
        instrumentos: ["Rúbrica MAUI"],
        programas: ["Visual Studio"],
        herramientas: [".NET MAUI", "XAML"],
        recursos: [{ nombre: "MAUI Docs", url: "https://learn.microsoft.com/" }],
        evidencias: [{ titulo: "Práctica 9 Net Maui", url: "https://github.com/" }]
      },
      {
        id: "mod-arcides-3",
        docente: "Prof. Arcides Canales",
        titulo: "Modulo 3 Conversación de ingles / Scrum",
        resumen: "Metodologías ágiles Scrum y bases de datos conectadas con IA.",
        instrumentos: ["Guía Scrum"],
        programas: ["VS Code"],
        herramientas: ["Scrum"],
        recursos: [{ nombre: "Scrum Guide", url: "https://scrumguides.org/" }],
        evidencias: [{ titulo: "Práctica Scrum", url: "https://github.com/" }]
      },
      {
        id: "mod-arcides-4",
        docente: "Prof. Arcides Canales",
        titulo: "Modulo 4 Puesta en marcha de empresa cooperativa",
        resumen: "Tiendas online con PrestaShop, prototipos con Arduino y aplicaciones WinForms.",
        instrumentos: ["Rúbrica PrestaShop"],
        programas: ["XAMPP", "Arduino IDE"],
        herramientas: ["PrestaShop", "Arduino"],
        recursos: [{ nombre: "PrestaShop Docs", url: "https://devdocs.prestashop-project.org/" }],
        evidencias: [{ titulo: "Proyecto PrestaShop", url: "https://github.com/" }]
      }
    ];

    function cargarModulos(filtro = "") {
      const gridJavier = document.getElementById("grid-javier");
      const gridArcides = document.getElementById("grid-arcides");
      
      if (!gridJavier || !gridArcides) return;

      gridJavier.innerHTML = "";
      gridArcides.innerHTML = "";

      const textoFiltro = filtro.toLowerCase();

      modulosData.forEach(modulo => {
        const coincide = modulo.titulo.toLowerCase().includes(textoFiltro) ||
                         modulo.docente.toLowerCase().includes(textoFiltro) ||
                         modulo.resumen.toLowerCase().includes(textoFiltro) ||
                         modulo.herramientas.some(h => h.toLowerCase().includes(textoFiltro));

        if (!coincide) return;

        const guardado = localStorage.getItem(modulo.id) === "true";

        const card = document.createElement("article");
        card.className = "proy";
        card.innerHTML = `
          <div>
            <h3>${modulo.titulo}</h3>
            <p class="lema"><b>Docente:</b> ${modulo.docente}</p>
            <p>${modulo.resumen}</p>
          </div>
          <div class="card-footer">
            <input type="checkbox" class="checkbox-progreso" ${guardado ? "checked" : ""} onchange="guardarProgreso('${modulo.id}', this.checked)" title="Marcar como repasado">
            <button onclick="verFicha('${modulo.id}')" class="btn-sec">Ver Ficha Completa</button>
          </div>
        `;

        if (modulo.docente === "Prof. Javier") {
          gridJavier.appendChild(card);
        } else {
          gridArcides.appendChild(card);
        }
      });
    }

    function filtrarModulos() {
      const query = document.getElementById("buscador").value;
      cargarModulos(query);
    }

    function guardarProgreso(id, estado) {
      localStorage.setItem(id, estado);
    }

    function verFicha(id) {
      const modulo = modulosData.find(m => m.id === id);
      if (!modulo) return;

      const modalBody = document.getElementById("modal-body");
      modalBody.innerHTML = `
        <h2 style="font-family: 'Orbitron', sans-serif; color: var(--primary-cyan); font-size:16px; margin-bottom: 6px;">${modulo.titulo}</h2>
        <p style="font-size:13.5px; margin-bottom: 8px;"><b>Docente:</b> ${modulo.docente}</p>
        <hr style="border: 0; border-top: 1px solid var(--border-color); margin: 10px 0;">
        <p style="margin-bottom: 10px; font-size:13.5px;">${modulo.resumen}</p>

        <h4 style="color: var(--accent-magenta); font-size:12.5px; margin-top: 6px;">Herramientas</h4>
        <p style="font-size:13px; color:var(--text-muted);">${modulo.herramientas.join(", ")}</p>

        <h4 style="color: var(--accent-magenta); font-size:12.5px; margin-top: 6px;">Evidencias</h4>
        <ul style="padding-left:18px; font-size:13px;">
          ${modulo.evidencias.map(e => `<li><a href="${e.url}" target="_blank" style="color:var(--primary-cyan);">${e.titulo}</a></li>`).join('')}
        </ul>
      `;

      document.getElementById("modal-ficha").showModal();
    }

    function cerrarFicha() {
      document.getElementById("modal-ficha").close();
    }

    function alternarTema() {
      const html = document.documentElement;
      const actual = html.getAttribute("data-theme");
      const nuevo = actual === "dark" ? "light" : "dark";
      html.setAttribute("data-theme", nuevo);
      localStorage.setItem("theme", nuevo);
    }

    document.addEventListener("DOMContentLoaded", () => {
      const temaGuardado = localStorage.getItem("theme") || "dark";
      document.documentElement.setAttribute("data-theme", temaGuardado);
      cargarModulos();
    });
  </script>
</body>
</html>
