<html lang="es" data-theme="dark">
<head>

    :root[data-theme="dark"] {
      --bg-color: #030712;
      --panel-bg: rgba(8, 15, 30, 0.85);
      --card-bg: linear-gradient(145deg, rgba(13, 24, 48, 0.95), rgba(7, 13, 28, 0.95));
      --border-color: #1e293b;
      --accent-neon: #eab308;
      --primary-cyan: #06b6d4;
      --accent-magenta: #ec4899;
      --accent-purple: #c084fc;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --input-bg: rgba(15, 23, 42, 0.9);
    }

    :root[data-theme="light"] {
      --bg-color: #f1f5f9;
      --panel-bg: rgba(255, 255, 255, 0.9);
      --card-bg: linear-gradient(145deg, #ffffff, #f8fafc);
      --border-color: #cbd5e1;
      --accent-neon: #ca8a04;
      --primary-cyan: #0284c7;
      --accent-magenta: #db2777;
      --accent-purple: #9333ea;
      --text-main: #0f172a;
      --text-muted: #475569;
      --input-bg: #ffffff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; transition: background 0.3s, color 0.3s, transform 0.25s, box-shadow 0.25s; }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Exo 2', sans-serif;
      line-height: 1.6;
      position: relative;
      min-height: 100vh;
      overflow-x: hidden;
    }

    #bg-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      pointer-events: none;
      opacity: 0.35;
    }

    .navbar {
      position: sticky;
      top: 0;
      z-index: 10;
      background: var(--panel-bg);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-color);
      padding: 14px 24px;
    }

    .nav-container {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
      z-index: 2;
    }

    .logo {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 18px;
      background: linear-gradient(135deg, var(--primary-cyan), var(--accent-neon));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 1px;
    }

    .nav-controls {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .tag-version {
      background: rgba(6, 182, 212, 0.15);
      border: 1px solid var(--primary-cyan);
      color: var(--primary-cyan);
      font-size: 12px;
      padding: 4px 14px;
      border-radius: 999px;
      font-family: 'Rajdhani', sans-serif;
      font-weight: 700;
    }

    .btn-theme {
      background: var(--input-bg);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-family: 'Rajdhani', sans-serif;
      font-weight: 700;
      font-size: 12px;
    }
    .btn-theme:hover { border-color: var(--accent-neon); }

    .hero {
      position: relative;
      z-index: 2;
      padding: 50px 20px 30px;
      text-align: center;
      border-bottom: 1px solid var(--border-color);
      background: radial-gradient(circle at top, rgba(192, 132, 252, 0.1), transparent 70%);
    }

    .hero h1 {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: clamp(32px, 5vw, 46px);
      background: linear-gradient(135deg, var(--primary-cyan), var(--accent-purple), var(--accent-magenta));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 12px;
      letter-spacing: 0.5px;

    .hero-subtitle { color: var(--text-muted); font-size: 16px; margin-bottom: 25px; }

    .filter-container {
      max-width: 600px;
      margin: 0 auto;
      padding: 0 20px;
    }

    .search-input {

      background: var(--input-bg);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 14px 22px;
      border-radius: 12px;
      font-size: 15px;
      outline: none;
      backdrop-filter: blur(8px);
      font-family: 'Exo 2', sans-serif;
    }
    .search-input:focus { 
      border-color: var(--primary-cyan);

    .main-container {

      padding: 0 20px;
    }

      padding: 28px;
      backdrop-filter: blur(10px);

    .profesor-header {

      align-items: center;
      gap: 15px;
      margin-bottom: 22px;
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 14px;

    .profesor-badge {

      padding: 6px 14px;
      border-radius: 8px;

      letter-spacing: 1px;

    .profesor-header h2 {

      font-size: 22px;
      background: linear-gradient(90deg, #f8fafc, var(--accent-neon));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 1px;
    }

    /* Carrusel Deslizante Horizontal (Auto-scroll con Hover) */

      gap: 24px;
      overflow-x: auto;

      scroll-behavior: smooth;
      scrollbar-width: thin;
      scrollbar-color: var(--primary-cyan) var(--border-color);

    .modulos-slider::-webkit-scrollbar { height: 8px; }
    .modulos-slider::-webkit-scrollbar-track { background: var(--input-bg); border-radius: 4px; }
    .modulos-slider::-webkit-scrollbar-thumb { background: var(--primary-cyan); border-radius: 4px; }

    /* Tarjetas Corredisas */

      background: var(--card-bg);
      border: 1px solid rgba(6, 182, 212, 0.25);
      border-left: 5px solid var(--primary-cyan);

      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);

    .proy:hover {
      transform: translateY(-6px);
      border-color: var(--accent-neon);
      border-left-color: var(--accent-neon);
      box-shadow: 0 12px 35px rgba(234, 179, 8, 0.25), 0 0 15px rgba(6, 182, 212, 0.2);
    }

    .proy h3 {
      font-family: 'Rajdhani', sans-serif;
      font-weight: 700;
      font-size: 17px;
      color: #ffffff;
      margin-bottom: 10px;
      line-height: 1.35;
      letter-spacing: 0.5px;
    }

    .proy .lema {

      background: rgba(6, 182, 212, 0.12);
      border: 1px solid rgba(6, 182, 212, 0.3);

      font-weight: 700;
      font-size: 12px;
      padding: 3px 10px;
      border-radius: 6px;
      margin-bottom: 12px;
    }

    .proy p { 
      color: var(--text-muted); 
      font-size: 13.5px; 
      margin-bottom: 20px; 
      line-height: 1.55;
    }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding-top: 16px;

    .progreso-container {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-main);
      cursor: pointer;
      user-select: none;

    .checkbox-progreso {
      width: 18px;
      height: 18px;
      accent-color: var(--accent-neon);
      cursor: pointer;
    }

    .btn-sec {
      background: linear-gradient(135deg, var(--primary-cyan), var(--accent-purple));
      color: #030712;
      font-family: 'Orbitron', sans-serif;
      font-weight: 800;
      font-size: 11px;
      border: none;
      border-radius: 8px;
      padding: 10px 16px;

      color: var(--text-main);

      backdrop-filter: blur(12px);

    }

    .modal-content { position: relative; }
    
    .btn-close {
      position: absolute;
      top: -12px;
      right: 0;
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 28px;
      cursor: pointer;
    }
    .btn-close:hover { color: var(--accent-magenta); }

    .quiz-box {
      margin-top: 18px;
      padding: 16px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
    }
    .quiz-opcion {
      display: block;
      width: 100%;
      padding: 10px 14px;
      margin: 8px 0;
      background: var(--input-bg);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      border-radius: 8px;
      cursor: pointer;
      text-align: left;
      font-size: 13px;
      font-family: 'Exo 2', sans-serif;
    }
    .quiz-opcion:hover { border-color: var(--accent-neon); }
    .feedback { font-size: 13px; margin-top: 10px; font-weight: 600; }

</head>

  <script>
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');
    let width, height, squares = [];

    function initCanvas() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      squares = [];
      for (let i = 0; i < 45; i++) {
        squares.push({
          x: Math.random() * width,
          y: Math.random() * height,
          size: Math.random() * 24 + 8,
          speed: Math.random() * 1.2 + 0.3,
          color: Math.random() > 0.5 ? '#eab308' : '#06b6d4',
          filled: Math.random() > 0.6
        });
      }
    }

    function animateCanvas() {
      ctx.clearRect(0, 0, width, height);
      squares.forEach(sq => {
        ctx.strokeStyle = sq.color;
        ctx.fillStyle = sq.color;
        ctx.lineWidth = 1.5;
        
        if (sq.filled) {
          ctx.fillRect(sq.x, sq.y, sq.size, sq.size);
        } else {
          ctx.strokeRect(sq.x, sq.y, sq.size, sq.size);
        }

        sq.y += sq.speed;
        if (sq.y > height) {
          sq.y = -sq.size;
          sq.x = Math.random() * width;
        }
      });
      requestAnimationFrame(animateCanvas);
    }

    window.addEventListener('resize', initCanvas);
    initCanvas();
    animateCanvas();

    function cargarModulos(filtro = "") {
      const sliderJavier = document.getElementById("slider-javier");
      const sliderArcides = document.getElementById("slider-arcides");
      
      if (!sliderJavier || !sliderArcides) return;

      sliderJavier.innerHTML = "";
      sliderArcides.innerHTML = "";

      const textoFiltro = filtro.toLowerCase();

      modulosData.forEach(modulo => {
        const coincide = modulo.titulo.toLowerCase().includes(textoFiltro) ||
                         modulo.docente.toLowerCase().includes(textoFiltro) ||
                         modulo.resumen.toLowerCase().includes(textoFiltro) ||
                         modulo.herramientas.some(h => h.toLowerCase().includes(textoFiltro));

        if (!coincide) return;

        const repasado = localStorage.getItem(modulo.id) === "true";

        const card = document.createElement("article");
        card.className = "proy";
        card.innerHTML = `
          <div>
            <h3>${modulo.titulo}</h3>
            <span class="lema">Docente: ${modulo.docente}</span>
            <p>${modulo.resumen}</p>
          </div>
          <div class="card-footer">
            <label class="progreso-container">
              <input type="checkbox" class="checkbox-progreso" ${repasado ? "checked" : ""} onchange="guardarProgreso('${modulo.id}', this.checked)">
              <span>Repasado</span>
            </label>
            <button onclick="verFicha('${modulo.id}')" class="btn-sec">Ver Ficha & Quiz</button>
          </div>
        `;

        if (modulo.docente === "Prof. Javier") {
          sliderJavier.appendChild(card);
        } else {
          sliderArcides.appendChild(card);
        }
      });

      configurarAutoScroll();
    }

    // Configuración para que se mueva automáticamente al pasar el cursor (Hover)
    function configurarAutoScroll() {
      const sliders = document.querySelectorAll('.modulos-slider');

      sliders.forEach(slider => {
        let intervalo = null;

        slider.addEventListener('mouseenter', () => {
          intervalo = setInterval(() => {
            if (slider.scrollLeft + slider.clientWidth >= slider.scrollWidth - 5) {
              slider.scrollLeft = 0; // Regresa al inicio de forma suave
            } else {
              slider.scrollLeft += 1.5; // Velocidad de desplazamiento automático
            }
          }, 20);
        });

        slider.addEventListener('mouseleave', () => {
          clearInterval(intervalo);
        });
      });
    }

    function filtrarModulos() {
      const query = document.getElementById("buscador").value;
      cargarModulos(query);
    }

    function guardarProgreso(id, estado) {
      localStorage.setItem(id, estado);
    }

    function verFicha(id) {
      const modulo = modulosData.find(m => m.id === id);
      if (!modulo) return;

      const modalBody = document.getElementById("modal-body");
      modalBody.innerHTML = `
        <h2 style="font-family: 'Rajdhani', sans-serif; font-weight: 700; color: var(--accent-neon); font-size:19px; margin-bottom: 6px;">${modulo.titulo}</h2>
        <p style="font-size:13.5px; margin-bottom: 8px;"><b>Docente:</b> ${modulo.docente}</p>
        <hr style="border: 0; border-top: 1px solid var(--border-color); margin: 10px 0;">
        <p style="margin-bottom: 10px; font-size:13.5px;">${modulo.resumen}</p>

        <h4 style="color: var(--primary-cyan); font-family: 'Rajdhani', sans-serif; font-size:14px; margin-top: 6px;">Herramientas</h4>
        <p style="font-size:13px; color:var(--text-muted);">${modulo.herramientas.join(", ")}</p>

        <h4 style="color: var(--primary-cyan); font-family: 'Rajdhani', sans-serif; font-size:14px; margin-top: 6px;">Evidencias</h4>
        <ul style="padding-left:18px; font-size:13px;">
          ${modulo.evidencias.map(e => `<li><a href="${e.url}" target="_blank" style="color:var(--accent-neon);">${e.titulo}</a></li>`).join('')}
        </ul>

        <div class="quiz-box">
          <h4 style="color: var(--accent-neon); font-family: 'Rajdhani', sans-serif; font-size:14px; margin-bottom: 6px;">🧠 Quiz Interactivo</h4>
          <p style="font-size:13px; font-weight:600; margin-bottom: 8px;">${modulo.quiz.pregunta}</p>
          <div id="quiz-opciones-${modulo.id}">
            ${modulo.quiz.opciones.map((op, idx) => `
              <button class="quiz-opcion" onclick="verificarRespuesta('${modulo.id}', ${idx}, ${modulo.quiz.correcta}, '${modulo.quiz.explicacion}')">${op}</button>
            `).join('')}
          </div>
          <div id="quiz-feedback-${modulo.id}" class="feedback"></div>
        </div>
      `;

      document.getElementById("modal-ficha").showModal();
    }

    function verificarRespuesta(id, seleccionada, correcta, explicacion) {
      const feedbackDiv = document.getElementById(`quiz-feedback-${id}`);
      if (seleccionada === correcta) {
        feedbackDiv.style.color = "#eab308";
        feedbackDiv.innerHTML = `✅ ${explicacion}`;
      } else {
        feedbackDiv.style.color = "#ec4899";
        feedbackDiv.innerHTML = `❌ Respuesta incorrecta. ¡Inténtalo de nuevo!`;
      }
    }

    function cerrarFicha() {
      document.getElementById("modal-ficha").close();
    }

    function alternarTema() {
      const html = document.documentElement;
      const actual = html.getAttribute("data-theme");
      const nuevo = actual === "dark" ? "light" : "dark";
      html.setAttribute("data-theme", nuevo);
      localStorage.setItem("theme", nuevo);
    }

    document.addEventListener("DOMContentLoaded", () => {
      const temaGuardado = localStorage.getItem("theme") || "dark";
      document.documentElement.setAttribute("data-theme", temaGuardado);
      cargarModulos();
    });
  </script>
</body>
</html>
