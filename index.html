<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Portal de Repaso - v0.4</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600;700&family=Orbitron:wght@600;800&display=swap" rel="stylesheet">
  
  <!-- Todos los estilos metidos aquí directamente para que no necesites style.css -->
  <style>
    :root {
      --bg-color: #070a15;
      --panel-bg: #0f1630;
      --border-color: #222c55;
      --primary-cyan: #22d3ee;
      --accent-magenta: #f046d2;
      --text-main: #e8edfb;
      --text-muted: #9ba7ce;
      --font-title: 'Orbitron', sans-serif;
      --font-body: 'Exo 2', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: var(--font-body);
      line-height: 1.6;
    }

    .navbar {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(7, 10, 21, 0.9);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border-color);
      padding: 14px 24px;
    }

    .nav-container {
      max-width: 1080px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-family: var(--font-title);
      font-weight: 800;
      font-size: 16px;
      color: var(--primary-cyan);
    }

    .tag-version {
      background: rgba(34, 211, 238, 0.1);
      border: 1px solid var(--primary-cyan);
      color: var(--primary-cyan);
      font-size: 12px;
      padding: 2px 10px;
      border-radius: 999px;
    }

    .hero {
      padding: 60px 20px 40px;
      text-align: center;
      border-bottom: 1px solid var(--border-color);
      background: radial-gradient(circle at top, rgba(240, 70, 210, 0.12), transparent 70%);
    }

    .hero h1 {
      font-family: var(--font-title);
      font-size: clamp(28px, 5vw, 42px);
      color: #fff;
      margin-bottom: 10px;
    }

    .hero-subtitle { color: var(--text-muted); font-size: 18px; }

    .main-container {
      max-width: 1080px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .section-title {
      font-family: var(--font-title);
      font-size: 22px;
      margin-bottom: 24px;
      border-left: 4px solid var(--primary-cyan);
      padding-left: 12px;
    }

    .modulos-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
    }

    .proy {
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .proy h3 {
      font-family: var(--font-title);
      font-size: 18px;
      color: #fff;
      margin-bottom: 8px;
    }

    .proy .lema {
      color: var(--primary-cyan);
      font-size: 14px;
      margin-bottom: 12px;
    }

    .proy p { color: var(--text-muted); font-size: 15px; }

    .btn-sec {
      background: linear-gradient(135deg, #0891b2, var(--primary-cyan));
      color: #04121a;
      font-weight: 700;
      border: none;
      border-radius: 8px;
      padding: 10px 18px;
      cursor: pointer;
    }

    .modal {
      margin: auto;
      border: 1px solid var(--border-color);
      border-radius: 14px;
      background: var(--panel-bg);
      color: var(--text-main);
      padding: 30px;
      max-width: 650px;
      width: 90%;
    }

    .modal::backdrop { background: rgba(0, 0, 0, 0.7); }
    .modal-content { position: relative; }
    
    .btn-close {
      position: absolute;
      top: -10px;
      right: 0;
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 28px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Navegación -->
  <nav class="navbar">
    <div class="nav-container">
      <span class="logo">PORTAL DE REPASO</span>
      <span class="tag-version">Versión v0.4</span>
    </div>
  </nav>

  <!-- Portada -->
  <header class="hero">
    <div class="hero-content">
      <h1>Portal del Año</h1>
      <p class="hero-subtitle">Repaso integral de módulos técnicos y herramientas de desarrollo.</p>
    </div>
  </header>

  <!-- Contenido Principal -->
  <main class="main-container">
    <h2 class="section-title">Módulos del Año</h2>
    <div id="contenedor-modulos" class="modulos-grid">
      <!-- Aquí se generan automáticamente las tarjetas mediante JavaScript -->
    </div>
  </main>

  <!-- Modal / Ficha del Módulo -->
  <dialog id="modal-ficha" class="modal">
    <div class="modal-content">
      <button class="btn-close" onclick="cerrarFicha()">&times;</button>
      <div id="modal-body"></div>
    </div>
  </dialog>

  <!-- Script que carga los datos y pinta la página -->
  <script src="data/modulos.js"></script>
  <script>
    function cargarModulos() {
      const contenedor = document.getElementById("contenedor-modulos");
      if (!contenedor) return;
      contenedor.innerHTML = "";

      // Verifica que modulosData exista (viene de data/modulos.js)
      if (typeof modulosData === "undefined") return;

      modulosData.forEach(modulo => {
        const card = document.createElement("article");
        card.className = "proy";
        card.innerHTML = `
          <h3>${modulo.titulo}</h3>
          <p class="lema"><b>Docente:</b> ${modulo.docente}</p>
          <p style="margin-bottom: 16px;">${modulo.resumen}</p>
          <button onclick="verFicha('${modulo.id}')" class="btn-sec">Ver Ficha Completa</button>
        `;
        contenedor.appendChild(card);
      });
    }

    function verFicha(id) {
      const modulo = modulosData.find(m => m.id === id);
      if (!modulo) return;

      const modalBody = document.getElementById("modal-body");
      modalBody.innerHTML = `
        <h2 style="font-family: var(--font-title); color: var(--primary-cyan); margin-bottom: 8px;">${modulo.titulo}</h2>
        <p><b>Docente:</b> ${modulo.docente}</p>
        <hr style="border: 0; border-top: 1px solid var(--border-color); margin: 16px 0;">
        <p style="margin-bottom: 14px;">${modulo.resumen}</p>

        <h4 style="color: var(--accent-magenta); margin-top: 12px;">Instrumentos</h4>
        <p>${modulo.instrumentos ? modulo.instrumentos.join(", ") : "No especificados"}</p>

        <h4 style="color: var(--accent-magenta); margin-top: 12px;">Programas</h4>
        <p>${modulo.programas ? modulo.programas.join(", ") : "No especificados"}</p>

        <h4 style="color: var(--accent-magenta); margin-top: 12px;">Herramientas</h4>
        <p>${modulo.herramientas ? modulo.herramientas.join(", ") : "No especificadas"}</p>

        <h4 style="color: var(--accent-magenta); margin-top: 12px;">Recursos</h4>
        <ul>
          ${modulo.recursos ? modulo.recursos.map(r => `<li><a href="${r.url}" target="_blank" style="color:var(--primary-cyan);">${r.nombre}</a></li>`).join('') : '<li>Sin recursos</li>'}
        </ul>
      `;

      document.getElementById("modal-ficha").showModal();
    }

    function cerrarFicha() {
      document.getElementById("modal-ficha").close();
    }

    document.addEventListener("DOMContentLoaded", cargarModulos);
  </script>
</body>
</html>
