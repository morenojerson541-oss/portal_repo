<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal de Repaso - 3DS B (v0.4)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600;700&family=Orbitron:wght@600;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-color: #070a15;
      --panel-bg: #0f1630;
      --border-color: #222c55;
      --primary-cyan: #22d3ee;
      --accent-magenta: #f046d2;
      --accent-purple: #a855f7;
      --text-main: #e8edfb;
      --text-muted: #9ba7ce;
      --font-title: 'Orbitron', sans-serif;
      --font-body: 'Exo 2', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: var(--font-body);
      line-height: 1.6;
    }

    .navbar {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(7, 10, 21, 0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-color);
      padding: 14px 24px;
    }

    .nav-container {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-family: var(--font-title);
      font-weight: 800;
      font-size: 16px;
      color: var(--primary-cyan);
      text-shadow: 0 0 10px rgba(34, 211, 238, 0.4);
    }

    .tag-version {
      background: rgba(34, 211, 238, 0.1);
      border: 1px solid var(--primary-cyan);
      color: var(--primary-cyan);
      font-size: 12px;
      padding: 3px 12px;
      border-radius: 999px;
      font-family: var(--font-title);
    }

    .hero {
      padding: 50px 20px 30px;
      text-align: center;
      border-bottom: 1px solid var(--border-color);
      background: radial-gradient(circle at top, rgba(168, 85, 247, 0.15), transparent 70%);
    }

    .hero h1 {
      font-family: var(--font-title);
      font-size: clamp(28px, 4vw, 40px);
      color: #fff;
      margin-bottom: 10px;
      text-shadow: 0 0 15px rgba(240, 70, 210, 0.3);
    }

    .hero-subtitle { color: var(--text-muted); font-size: 16px; }

    .main-container {
      max-width: 1200px;
      margin: 40px auto;
      padding: 0 20px;
    }

    /* Estilos de separador de profesor */
    .profesor-section {
      margin-bottom: 50px;
      background: rgba(15, 22, 48, 0.4);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 30px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }

    .profesor-header {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 25px;
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 15px;
    }

    .profesor-badge {
      background: linear-gradient(135deg, var(--accent-purple), var(--accent-magenta));
      color: #fff;
      font-family: var(--font-title);
      font-size: 13px;
      padding: 6px 14px;
      border-radius: 8px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .profesor-header h2 {
      font-family: var(--font-title);
      font-size: 22px;
      color: #fff;
    }

    .modulos-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 20px;
    }

    .proy {
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: all 0.3s ease;
    }

    .proy:hover {
      transform: translateY(-4px);
      border-color: var(--primary-cyan);
      box-shadow: 0 4px 20px rgba(34, 211, 238, 0.15);
    }

    .proy h3 {
      font-family: var(--font-title);
      font-size: 15px;
      color: #fff;
      margin-bottom: 8px;
    }

    .proy .lema {
      color: var(--primary-cyan);
      font-size: 13px;
      margin-bottom: 10px;
      font-weight: 600;
    }

    .proy p { color: var(--text-muted); font-size: 14px; margin-bottom: 20px; }

    .btn-sec {
      background: linear-gradient(135deg, #0891b2, var(--primary-cyan));
      color: #04121a;
      font-family: var(--font-title);
      font-size: 12px;
      font-weight: 700;
      border: none;
      border-radius: 8px;
      padding: 10px 16px;
      cursor: pointer;
      width: 100%;
      text-align: center;
      transition: filter 0.2s;
    }
    .btn-sec:hover { filter: brightness(1.2); }

    .modal {
      margin: auto;
      border: 1px solid var(--border-color);
      border-radius: 16px;
      background: var(--panel-bg);
      color: var(--text-main);
      padding: 35px;
      max-width: 650px;
      width: 90%;
      box-shadow: 0 10px 40px rgba(0,0,0,0.8);
    }
    .modal::backdrop { background: rgba(7, 10, 21, 0.8); backdrop-filter: blur(6px); }
    .modal-content { position: relative; }
    
    .btn-close {
      position: absolute;
      top: -15px;
      right: -5px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 30px;
      cursor: pointer;
    }
    .btn-close:hover { color: var(--accent-magenta); }
  </style>
</head>
<body>

  <nav class="navbar">
    <div class="nav-container">
      <span class="logo">PORTAL DE REPASO · 3DS B</span>
      <span class="tag-version">Versión v0.4</span>
    </div>
  </nav>

  <header class="hero">
    <div class="hero-content">
      <h1>Portal Académico Integral</h1>
      <p class="hero-subtitle">Módulos técnicos y proyectos correspondientes al año lectivo.</p>
    </div>
  </header>

  <main class="main-container">
    
    <!-- SECCIÓN PROFESOR JAVIER -->
    <section class="profesor-section">
      <div class="profesor-header">
        <span class="profesor-badge">Docente</span>
        <h2>Prof. Javier</h2>
      </div>
      <div id="grid-javier" class="modulos-grid"></div>
    </section>

    <!-- SECCIÓN PROFESOR ARCIDES CANALES -->
    <section class="profesor-section">
      <div class="profesor-header">
        <span class="profesor-badge" style="background: linear-gradient(135deg, #0891b2, #22d3ee); color:#04121a;">Docente</span>
        <h2>Prof. Arcides Canales</h2>
      </div>
      <div id="grid-arcides" class="modulos-grid"></div>
    </section>

  </main>

  <dialog id="modal-ficha" class="modal">
    <div class="modal-content">
      <button class="btn-close" onclick="cerrarFicha()">&times;</button>
      <div id="modal-body"></div>
    </div>
  </dialog>

  <script>
    const modulosData = [
      // MÓDULOS PROFESOR JAVIER
      {
        id: "mod-javier-0",
        docente: "Prof. Javier",
        titulo: "Módulo 3.0 Orientación de estudiantes al proceso educativo",
        resumen: "Inducción al tercer año, creación de equipos de trabajo y organización del portafolio estudiantil.",
        instrumentos: ["Guía de inducción", "Rúbrica de equipos de trabajo"],
        programas: ["Plataforma Educativa", "Herramientas de colaboración"],
        herramientas: ["Portafolio digital", "Códigos QR"],
        recursos: [{ nombre: "Generalidades del Módulo 3.0", url: "https://classroom.google.com/" }],
        evidencias: [{ titulo: "Creación de equipo de trabajo", url: "https://github.com/" }]
      },
      {
        id: "mod-javier-2",
        docente: "Prof. Javier",
        titulo: "Módulo 3.2 Mantenimiento y aseguramiento de la operación del sistemas informáticos",
        resumen: "Monitoreo, registro de mantenimiento, creación de dashboards operativos, ejecución y planes de contingencia técnica.",
        instrumentos: ["Guías de monitoreo", "Rúbricas de planes de contingencia"],
        programas: ["Visual Studio", "Herramientas de monitoreo de red"],
        herramientas: ["Dashboards", "Bitácoras de mantenimiento"],
        recursos: [{ nombre: "Documentación de Mantenimiento", url: "https://learn.microsoft.com/" }],
        evidencias: [
          { titulo: "Semana 3 Monitoreo y Registro", url: "https://github.com/" },
          { titulo: "Semana 4 Creación de Dashboard", url: "https://github.com/" }
        ]
      },
      {
        id: "mod-javier-3",
        docente: "Prof. Javier",
        titulo: "Módulo 3.3 Administración de Bases de Datos",
        resumen: "Gestión avanzada de bases de datos, optimización de consultas, prácticas y actividades de recuperación técnica.",
        instrumentos: ["Rúbrica de administración SQL", "Pruebas prácticas de BD"],
        programas: ["SQL Server Management Studio", "Power BI"],
        herramientas: ["SQL", "Power BI Dashboards"],
        recursos: [{ nombre: "Recursos de Power BI y SQL", url: "https://learn.microsoft.com/" }],
        evidencias: [
          { titulo: "Actividad Power BI", url: "https://github.com/" },
          { titulo: "Ejecutar Final más Dashboard", url: "https://github.com/" }
        ]
      },
      {
        id: "mod-javier-4",
        docente: "Prof. Javier",
        titulo: "Módulo 3.4 Elaboración de documentación de Sistemas informáticos",
        resumen: "Estructuración de fases de desarrollo, arquitectura de software, guías de Python individuales y documentación técnica final.",
        instrumentos: ["Rúbrica de documentación técnica", "Evaluación de guías de desarrollo"],
        programas: ["Python IDLE / VS Code", "Editores de documentación"],
        herramientas: ["Python", "Markdown / Plantillas de reporte"],
        recursos: [{ nombre: "Guía oficial de Python", url: "https://www.python.org/" }],
        evidencias: [
          { titulo: "Guía Python Individual", url: "https://github.com/" },
          { titulo: "Fase 2-3 Arquitectura del Software", url: "https://github.com/" },
          { titulo: "Fase 5 y Documentos Finales", url: "https://github.com/" }
        ]
      },
      {
        id: "mod-javier-8",
        docente: "Prof. Javier",
        titulo: "Módulo 3.8 Proyecto innovador de Desarrollo de Software",
        resumen: "Desarrollo y entrega de proyectos innovadores, avances de software, exposiciones y prácticas orientadas a soluciones informáticas reales.",
        instrumentos: ["Rúbrica de proyecto innovador", "Evaluación de exposiciones y avances"],
        programas: ["Visual Studio", "GitHub", "Entornos de desarrollo"],
        herramientas: ["C# / Python / Web", "Control de versiones Git"],
        recursos: [{ nombre: "Guía de proyectos innovadores", url: "https://github.com/" }],
        evidencias: [
          { titulo: "Avance 1 Proyecto Innovador (10%)", url: "https://github.com/" },
          { titulo: "Segunda Entrega Avance Proyecto (15%)", url: "https://github.com/" },
          { titulo: "Jueves Entrega Final", url: "https://github.com/" }
        ]
      },

      // MÓDULOS PROFESOR ARCIDES CANALES
      {
        id: "mod-arcides-1",
        docente: "Prof. Arcides Canales",
        titulo: "BTVDS 3.1 Desarrollo de aplicaciones de software para la solución de problemas",
        resumen: "Enfoque en Programación Orientada a Objetos (POO) avanzada, herencia, polimorfismo, bases de datos y ASP.NET Razor.",
        instrumentos: ["Guías de práctica POO", "Rúbricas de BD"],
        programas: ["Visual Studio", "SQL Server"],
        herramientas: ["C#", "ASP.NET Razor", "SQL"],
        recursos: [{ nombre: "Documentación oficial C#", url: "https://learn.microsoft.com/" }],
        evidencias: [{ titulo: "Práctica 02 POO Herencia y Polimorfismo", url: "https://github.com/" }]
      },
      {
        id: "mod-arcides-2",
        docente: "Prof. Arcides Canales",
        titulo: "Modulo 2 Desarrollo de componentes para dispositivos móviles",
        resumen: "Desarrollo de aplicaciones multiplataforma utilizando el framework .NET MAUI y componentes visuales móviles.",
        instrumentos: ["Rúbrica MAUI", "Lista de cotejo"],
        programas: ["Visual Studio", "Emulador Android"],
        herramientas: ["C#", ".NET MAUI", "XAML"],
        recursos: [{ nombre: "Documentación oficial .NET MAUI", url: "https://learn.microsoft.com/" }],
        evidencias: [{ titulo: "Práctica 9 Net Maui", url: "https://github.com/" }]
      },
      {
        id: "mod-arcides-3",
        docente: "Prof. Arcides Canales",
        titulo: "Modulo 3 Conversación de ingles sobre mantenimiento de sistemas informáticos",
        resumen: "Implementación de metodologías ágiles Scrum y bases de datos conectadas con asistencia de IA.",
        instrumentos: ["Guía Scrum", "Rúbrica CRUD-IA"],
        programas: ["VS Code", "Visual Studio"],
        herramientas: ["Scrum Framework", "Bases de datos relacionales"],
        recursos: [{ nombre: "Scrum Guide oficial", url: "https://scrumguides.org/" }],
        evidencias: [{ titulo: "Practica 11 Base de datos CRUD-IA", url: "https://github.com/" }]
      },
      {
        id: "mod-arcides-4",
        docente: "Prof. Arcides Canales",
        titulo: "Modulo 4 Puesta en marcha de la empresa en asociatividad cooperativa",
        resumen: "Gestión empresarial, tiendas en línea con PrestaShop, prototipos con Arduino y aplicaciones WinForms y .NET MAUI.",
        instrumentos: ["Rúbrica PrestaShop", "Evaluación Arduino"],
        programas: ["XAMPP", "Visual Studio", "Arduino IDE"],
        herramientas: ["PrestaShop", "Arduino", "WinForms", ".NET MAUI"],
        recursos: [{ nombre: "PrestaShop DevDocs", url: "https://devdocs.prestashop-project.org/" }],
        evidencias: [{ titulo: "Proyecto PrestaShop Individual", url: "https://github.com/" }]
      }
    ];

    function cargarModulos() {
      const gridJavier = document.getElementById("grid-javier");
      const gridArcides = document.getElementById("grid-arcides");
      
      if (!gridJavier || !gridArcides) return;

      gridJavier.innerHTML = "";
      gridArcides.innerHTML = "";

      modulosData.forEach(modulo => {
        const card = document.createElement("article");
        card.className = "proy";
        card.innerHTML = `
          <div>
            <h3>${modulo.titulo}</h3>
            <p class="lema"><b>Docente:</b> ${modulo.docente}</p>
            <p>${modulo.resumen}</p>
          </div>
          <button onclick="verFicha('${modulo.id}')" class="btn-sec">Ver Ficha Completa</button>
        `;

        if (modulo.docente === "Prof. Javier") {
          gridJavier.appendChild(card);
        } else {
          gridArcides.appendChild(card);
        }
      });
    }

    function verFicha(id) {
      const modulo = modulosData.find(m => m.id === id);
      if (!modulo) return;

      const modalBody = document.getElementById("modal-body");
      modalBody.innerHTML = `
        <h2 style="font-family: var(--font-title); color: var(--primary-cyan); font-size:17px; margin-bottom: 6px;">${modulo.titulo}</h2>
        <p style="font-size:14px; margin-bottom: 10px;"><b>Docente:</b> ${modulo.docente}</p>
        <hr style="border: 0; border-top: 1px solid var(--border-color); margin: 12px 0;">
        <p style="margin-bottom: 12px; font-size:14px; color: var(--text-main);">${modulo.resumen}</p>

        <h4 style="color: var(--accent-magenta); font-size:13px; margin-top: 8px;">Instrumentos</h4>
        <p style="font-size:13.5px; color:var(--text-muted);">${modulo.instrumentos.join(", ")}</p>

        <h4 style="color: var(--accent-magenta); font-size:13px; margin-top: 8px;">Programas</h4>
        <p style="font-size:13.5px; color:var(--text-muted);">${modulo.programas.join(", ")}</p>

        <h4 style="color: var(--accent-magenta); font-size:13px; margin-top: 8px;">Herramientas</h4>
        <p style="font-size:13.5px; color:var(--text-muted);">${modulo.herramientas.join(", ")}</p>

        <h4 style="color: var(--accent-magenta); font-size:13px; margin-top: 8px;">Recursos</h4>
        <ul style="padding-left:18px; font-size:13.5px;">
          ${modulo.recursos.map(r => `<li><a href="${r.url}" target="_blank" style="color:var(--primary-cyan);">${r.nombre}</a></li>`).join('')}
        </ul>

        <h4 style="color: var(--accent-magenta); font-size:13px; margin-top: 8px;">Evidencias</h4>
        <ul style="padding-left:18px; font-size:13.5px;">
          ${modulo.evidencias.map(e => `<li><a href="${e.url}" target="_blank" style="color:var(--primary-cyan);">${e.titulo}</a></li>`).join('')}
        </ul>
      `;

      document.getElementById("modal-ficha").showModal();
    }

    function cerrarFicha() {
      document.getElementById("modal-ficha").close();
    }

    document.addEventListener("DOMContentLoaded", cargarModulos);
  </script>
</body>
</html>
